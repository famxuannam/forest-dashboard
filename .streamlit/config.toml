# Chỉ 1 bộ [theme] sáng (tông RX-78-2 mặc định), KHÔNG có [theme.dark]: tông sáng/tối do theme
# Gundam đang chọn quyết định (xem GUNDAM_THEMES trong ui_catalog.py), không theo trình duyệt.
# Widget native nào đọc màu tĩnh ở đây đều được ép lại bằng var(--token) trong CSS của app.py.
[theme]
base = "light"
primaryColor = "#1f4fa8"
backgroundColor = "#eef0f4"
secondaryBackgroundColor = "#e3e7ef"
textColor = "#121722"
font = "sans serif"

[server]
# Phục vụ static/fonts/*.woff2 dạng file tĩnh (app/static/...) để trình duyệt cache font, thay vì nhúng
# base64 vào CSS ở mỗi session mới -- xem _font_src() trong app.py.
enableStaticServing = true
